name: Construire FlashLink

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: FlashLink-Windows
            artefact: dist/FlashLink.exe
          - os: ubuntu-latest
            name: FlashLink-Linux
            artefact: dist/FlashLink
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotheques Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Installer PyInstaller
        run: python -m pip install --upgrade pip pyinstaller PySide6-Essentials
      - name: Construire l'executable
        run: pyinstaller --onefile --windowed --name FlashLink flashlink_qt.py
      - name: Publier le resultat
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artefact }}
