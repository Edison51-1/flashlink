name: Construire NexaLink

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller PySide6-Essentials psutil
      - run: pyinstaller --onefile --windowed --name NexaLink --icon nexalink.ico --add-data "nexalink.png;." flashlink_qt.py
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: NexaLink-Windows-Installateur
          path: Output/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: NexaLink-Windows-Portable
          path: dist/NexaLink.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller PySide6-Essentials psutil
      - run: pyinstaller --onefile --name NexaLink --add-data "nexalink.png:." flashlink_qt.py
      - uses: actions/upload-artifact@v4
        with:
          name: NexaLink-Linux
          path: dist/NexaLink
